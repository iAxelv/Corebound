name: Corebound
version: '${version}'
main: com.corebound.thecore.TheCorePlugin
api-version: '26.2'
description: Corebound island foundation
author: iAx3lv
depend: [FastAsyncWorldEdit]
commands:
  is:
    description: Create and manage your Corebound island
    usage: /is <create|home|visit|invite|accept|coop|open|close|settings|members|kick|ban|unban|delete|leave|bypass|chat|perms|transfer|promote|demote|setspawn|rename>
    permission: thecore.island
permissions:
  thecore.*:
    description: Allows staff to bypass island protection and closed-island access
    default: false
    children:
      thecore.build: true
      thecore.bypass: true
      thecore.island: true
  thecore.admin:
    description: Allows administrative access to Corebound
    default: op
  thecore.island:
    description: Allows use of island commands
    default: true
  thecore.build:
    description: Allows building and interacting on any island
    default: false
  thecore.bypass:
    description: Allows visiting islands that are closed
    default: op
