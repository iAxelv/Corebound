title: "&5Core Management"
rows: 6
items:
  upgrades:
    material: ENCHANTED_BOOK
    slot: 10
    display-name: "&dUpgrades"
    lore:
      - "&7Upgrade different aspects of the Core."
      - ""
      - "&eClick to upgrade the Core."
  statistics:
    material: CRYING_OBSIDIAN
    slot: 4
    display-name: "&dCore Status"
    lore:
      - "&7Level: &e%level%&7/&e%max_level%"
      - "&7Fractures: &d%prestige% &8(&a+%prestige_bonus%% production&8)"
      - "&7Core Fragments: &b%fragments%"
      - "&7Energy: &6%energy%&7/&6%max_energy%⚡"
      - "&7Base production: &a+%base_energy%⚡/hit"
      - "&7Bonus capacity: &b+%capacity_bonus%%"
      - "&7Maximum combo multiplier: &bx%max_combo%"
      - "&7Pylons allowed: &e%pylons%"
  fracture:
    material: NETHER_STAR
    slot: 51
    display-name: "&d&lDIMENSIONAL FRACTURE"
    lore:
      - "&7Resets your Core to Level 1."
      - "&aPermanent bonus: +50% global production."
      - "&7Prestiges: &d%prestige%"
      - "&7Core Fragments: &b%fragments%"
      - "&cPylons and their Cells will be destroyed."
      - ""
      - "&eClick to fracture the Core."
    locked-material: BARRIER
    locked-name: "&cFracture Locked"
    locked-lore:
      - "&cRequires Core level &e%max_level%&c."
      - "&7Current level: &e%level%"
  astral-tree:
    material: NETHERITE_UPGRADE_SMITHING_TEMPLATE
    slot: 12
    display-name: "&5Fracture Tree"
    lore:
      - "&7Unlock astral skills with Core Fragments."
      - ""
      - "&eClick to explore the tree."
  pylon:
    material: SEA_LANTERN
    slot: 15
    display-name: "&bForge Pylon I"
    lore:
      - "&7Cost: &6%cost%⚡"
      - "&7Pylons placed: &e%placed_pylons%&7/&e%pylons%"
      - ""
      - "&eClick to forge."
    locked-material: BARRIER
    locked-name: "&cPylon Locked"
    locked-lore:
      - "&cRequires Core level &e3&c."
  cell-forge:
    material: ENCHANTING_TABLE
    slot: 11
    display-name: "&5Elemental Forge"
    lore:
      - "&7Forge elemental Cells and Runes."
      - ""
      - "&eClick to open the forge."
    locked-material: BARRIER
    locked-name: "&cForge Locked"
    locked-lore:
      - "&cRequires Core level &e5&c."
  condenser:
    material: BLAST_FURNACE
    slot: 14
    display-name: "&bMatter Condenser"
    lore:
      - "&7Turns cobblestone generators into ores."
      - "&7Only one can be placed per island at a time."
      - "&7You can buy as many replacements as you like."
      - "&7Cost: &6%cost%⚡"
      - "&7Placement range: &e%min_distance%-%max_distance% blocks"
      - ""
      - "&eClick to buy a Condenser."
    locked-material: BARRIER
    locked-name: "&cCondenser Already Placed"
    locked-lore:
      - "&7Only one is allowed per island."
    level-locked-material: BARRIER
    level-locked-name: "&cCondenser Locked"
    level-locked-lore:
      - "&cRequires Core level &e%required_level%&c."
  crop-generator:
    material: COMPOSTER
    slot: 16
    display-name: "&aCrop Catalyst"
    lore:
      - "&7Accelerates crops, cacti, sugar cane, bamboo, and kelp."
      - "&7Also helps trees grow from their saplings."
      - "&7Each shot consumes energy if it grows something."
      - "&7Cooldown decreases with each level."
      - "&7Only one can be placed per island."
      - "&7You can buy as many replacements as you like."
      - "&7Cost: &6%cost%⚡"
      - "&7Placement range: &e%min_distance%-%max_distance% blocks"
      - ""
      - "&eClick to buy."
    locked-material: BARRIER
    locked-name: "&cCatalyst Locked"
    locked-lore:
      - "&cRequires Core level &e%required_level%&c."
  sacrifice:
    material: SCULK_CATALYST
    slot: 21
    display-name: "&5Sacrifice"
    lore:
      - "&7Exchange minerals and crops for Essence."
      - ""
      - "&7Balance: &b%mineral_balance% %mineral_name%"
      - "&7Balance: &a%vegetal_balance% %vegetal_name%"
      - ""
    preview-header: "&eMaterials in your inventory:"
    preview-item: "&7%name% x%amount% &8→ &f%value% %essence_name%"
    empty-preview: "&8You have no materials to sacrifice."
    total-mineral: "&7You will receive: &b%value% %mineral_name%"
    total-vegetal: "&7You will receive: &a%value% %vegetal_name%"
    click-lore:
      - ""
      - "&eClick to sacrifice the materials."
  battery:
    material: COPPER_BLOCK
    slot: 23
    display-name: "&bResonance Battery"
    lore:
      - "&7Stores energy when the Core is full."
      - "&7Each Battery stores 50% of the Core's capacity."
      - "&7Offline energy: &e75% &7for up to &e%offline_hours%h&7."
      - "&7Batteries placed: &e%placed%&7/&e%capacity%"
      - "&7Cost: &6%cost%⚡"
      - ""
      - "&eClick to buy a Battery."
    locked-material: BARRIER
    locked-name: "&cBattery Locked"
    locked-lore:
      - "&cRequires Core level &e%required_level%&c."
  upgrade:
    material: NETHER_STAR
    slot: 47
    display-name: "&aUpgrade Core &7(Lv. %next_level%)"
    lore-enough:
      - "&7Cost: &6%cost%⚡"
      - "&7New base: &a+%next_base%⚡/hit"
      - " "
      - "&eClick to upgrade!"
    lore-insufficient:
      - "&7Cost: &6%cost%⚡"
      - "&7New base: &a+%next_base%⚡/hit"
      - " "
      - "&cNot enough energy."
    display-name-max-level: "&aCore Maxed &7(%max_level%)"
    lore-max-level:
      - "&7You have reached the Core's maximum level."
  close:
    material: ARROW
    slot: 49
    display-name: "&cClose"
    lore:
      - "&7Close the Core menu."
