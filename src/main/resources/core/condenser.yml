condenser:
  item:
    material: BLAST_FURNACE
  display:
    scale: 1.2
    height-offset: 1.8
    rotation-speed-ticks: 20
  purchase-cost: 500.0
  minimum-core-level: 3
  pickup-lock-core-level: 25
  max-level: 9
  upgrade:
    base-cost: 500.0
    cost-multiplier: 1.8
  generation:
    ore-chance: 0.1
    ore-chance-increase-per-level: 0.04
    maximum-ore-chance: 0.75
    older-ore-weight-decay: 0.45
    ore-weights:
      COAL_ORE: 1.0
      COPPER_ORE: 0.4
      IRON_ORE: 0.15
      GOLD_ORE: 0.05
      REDSTONE_ORE: 0.02
      LAPIS_ORE: 0.01
      EMERALD_ORE: 0.005
      DIAMOND_ORE: 0.002
      ANCIENT_DEBRIS: 0.0005
    energy-cost: 1.0
    energy-cost-per-level: 0.5
  runes:
    empty-slot:
      display-name: "&bRune Slot"
      lore:
        - "&7Shift-click a Rune in your inventory"
        - "&7to install it."
        - ""
        - "&7Click an installed Rune"
        - "&7to return it to your inventory."
    menu:
      locked-name: "&cUpgrade Locked"
      locked-lore:
        - "&cRequires Condenser level &e%required_level%&c."
        - "&7Slots after upgrade: &e%slots_current% &7→ &e%slots_next%"
      unlocked-name: "&aSlot Unlocked"
      unlocked-lore:
        - "&7Slots unlocked: &e%slots_current%"
      max-name: "&aRune Slots Maxed"
      max-lore:
        - "&7The Condenser already has all three slots."
    slot-required-level:
      '2': 3
      '3': 6
