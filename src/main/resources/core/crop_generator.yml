crop-generator:
  item:
    material: COMPOSTER
  display:
    scale: 1.1
    height-offset: 1.8
    rotation-period-ticks: 40
  purchase-cost: 750.0
  pickup-lock-core-level: 25
  upgrade:
    base-cost: 400.0
    cost-multiplier: 1.7
  energy:
    cost-per-shot:
      base: 1.0
      per-level: 0.25
  growth:
    shot-delay:
      base-seconds: 6.0
      reduction-per-level-seconds: 0.5
      minimum-seconds: 2.5
    feedback:
      sound: item.bone_meal.use
      volume: 0.8
      pitch: 1.1
  runes:
    maximum-harvest-bonus: 1.0
    slot-required-level:
      '2': 3
      '3': 6
  menus:
    main:
      title: "&5Crop Catalyst"
      slots:
        info: 4
        state: 20
        runes: 22
        upgrade: 24
        close: 40
      info:
        material: BOOK
        name: "&aCatalyst &7[Level %level%/%max_level%]"
        lore:
          - "&7Cooldown: &e%shot_delay%s"
          - "&7Cost per shot: &6%energy_cost%⚡"
          - "&7Harvest bonus: &e+%harvest%%"
      state:
        material: LEVER
        name: "&aGenerator Status"
        active: "&aACTIVE"
        idle: "&eIDLE"
        disabled: "&cDISABLED"
        enable-lore: "&eClick to enable."
        disable-lore: "&eClick to disable."
      runes:
        material: GREEN_STAINED_GLASS_PANE
        name: "&aCrop Runes"
        lore:
          - "&7Slots: &e%runes%/%slots%"
          - "&7Improve harvest yield and reduce energy use."
          - ""
          - "&eClick to manage Runes."
      upgrade:
        material: ANVIL
        max-material: NETHER_STAR
        name: "&eUpgrade to level %next_level%"
        max-name: "&aMaximum Level Reached"
        lore:
          - "&7Cost: &6%cost%⚡"
          - "&7Cooldown after upgrade: &e%shot_delay%s"
          - ""
          - "&eClick to upgrade."
        max-lore:
          - "&7The Catalyst has reached its maximum level."
      close:
        material: ARROW
        name: "&cClose"
    runes:
      title: "&5Catalyst Runes"
      progression-slot: 22
      back-slot: 26
      slot-layout:
        '1': [13]
        '2': [12, 14]
        '3': [11, 13, 15]
      empty-slot:
        material: GRAY_STAINED_GLASS_PANE
        name: "&bRune Slot"
        lore:
          - "&7Shift-click a Rune in your inventory"
          - "&7to install it."
          - ""
          - "&7Click an installed Rune"
          - "&7to return it to your inventory."
      progression:
        locked-material: BARRIER
        unlocked-material: ANVIL
        max-material: NETHER_STAR
        locked-name: "&cUpgrade Locked"
        unlocked-name: "&aSlot Unlocked"
        max-name: "&aRune Slots Maxed"
        locked-lore:
          - "&cRequires Catalyst level &e%required_level%&c."
          - "&7Slots after upgrade: &e%slots_current% &7→ &e%slots_next%"
        unlocked-lore:
          - "&7Slots unlocked: &e%slots_current%"
        max-lore:
          - "&7The Catalyst already has all three slots."
      back:
        material: ARROW
        name: "&cBack to Catalyst"
