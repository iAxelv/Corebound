crop-generator:
  item:
    material: COMPOSTER
  display:
    scale: 1.1
    height-offset: 1.8
    rotation-period-ticks: 40
  purchase-cost: 750.0
  pickup-lock-core-level: 10
  upgrade:
    base-cost: 400.0
    cost-multiplier: 1.7
  energy:
    base-cost: 25.0
    cost-per-level: 10.0
    interval-ticks: 6000
  growth:
    base-extra-stages: 0.1
    extra-stages-per-level: 0.2
  runes:
    maximum-harvest-bonus: 1.0
    slot-required-level:
      '2': 3
      '3': 6
  menus:
    main:
      title: "&2Catalizador de Cultivos"
      slots:
        info: 4
        state: 20
        runes: 22
        upgrade: 24
        close: 40
      info:
        material: BOOK
        name: "&aCatalizador &7[Nivel %level%/%max_level%]"
        lore:
          - "&7Consumo: &6%energy_cost%⚡ &7cada &e%interval%s"
          - "&7Aceleración estimada: &a+%growth%%"
          - "&7Bonificación de cosecha: &e+%harvest%%"
      state:
        material: LEVER
        name: "&aEstado del generador"
        active: "&aACTIVE"
        idle: "&eIDLE"
        disabled: "&cDISABLE"
        enable-lore: "&eHaz clic para activar."
        disable-lore: "&eHaz clic para desactivar."
      runes:
        material: GREEN_STAINED_GLASS_PANE
        name: "&aRunas de Cultivo"
        lore:
          - "&7Ranuras: &e%runes%/%slots%"
          - "&7Mejoran la cosecha y reducen el consumo."
          - ""
          - "&eHaz clic para administrar las runas."
      upgrade:
        material: ANVIL
        max-material: NETHER_STAR
        name: "&eMejorar al nivel %next_level%"
        max-name: "&aNivel máximo alcanzado"
        lore:
          - "&7Costo: &6%cost%⚡"
          - "&7Aceleración al mejorar: &a+%growth%%"
          - ""
          - "&eHaz clic para mejorar."
        max-lore:
          - "&7El Catalizador ya alcanzó su nivel máximo."
      close:
        material: ARROW
        name: "&cCerrar"
    runes:
      title: "&2Runas del Catalizador"
      progression-slot: 22
      back-slot: 26
      slot-layout:
        '1': [13]
        '2': [12, 14]
        '3': [11, 13, 15]
      empty-slot:
        material: GREEN_STAINED_GLASS_PANE
        name: "&aRanura de runa"
        lore:
          - "&7Mayús+clic en una runa de tu inventario"
          - "&7para instalarla."
          - ""
          - "&7Haz clic en una runa instalada"
          - "&7para devolverla a tu inventario."
      progression:
        locked-material: BARRIER
        unlocked-material: NETHER_STAR
        max-material: NETHER_STAR
        locked-name: "&cMejora bloqueada"
        unlocked-name: "&aRanura desbloqueada"
        max-name: "&aRanuras de runa al máximo"
        locked-lore:
          - "&cRequiere Catalizador nivel &e%required_level%&c."
          - "&7Ranuras al mejorar: &e%slots_current% &7→ &e%slots_next%"
        unlocked-lore:
          - "&7Ranuras desbloqueadas: &e%slots_current%"
        max-lore:
          - "&7El Catalizador ya tiene sus tres ranuras."
      back:
        material: ARROW
        name: "&cVolver"
