name: Build beta plugin

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build beta JAR
        run: ./gradlew test jar -PpluginVersion="0.1.0-beta.${{ github.run_number }}"

      - name: Upload beta JAR
        uses: actions/upload-artifact@v4
        with:
          name: Corebound-0.1.0-beta-${{ github.run_number }}
          path: build/libs/Corebound-0.1.0-beta.${{ github.run_number }}.jar
          if-no-files-found: error
          retention-days: 30
